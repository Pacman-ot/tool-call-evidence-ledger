[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tool-call-evidence-ledger"
version = "0.1.0"
description = "Tamper-evident tool-call evidence ledger with claim verification for agentic AI"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Aditya Maurya", email = "notes@noteaditya.dev" }]
keywords = [
  "agents",
  "tool-calling",
  "evidence",
  "hash-chain",
  "verification",
  "llm",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = [
  "pydantic>=2.7.0",
]

[project.optional-dependencies]
api = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "mangum>=0.19.0",
  "python-dotenv>=1.0.0",
]
cli = [
  "typer>=0.12.0",
  "python-dotenv>=1.0.0",
]
openai = [
  "openai>=1.40.0",
]
dev = [
  "pytest>=8.0.0",
  "httpx>=0.27.0",
  "tool-call-evidence-ledger[api,cli,openai]",
]
all = [
  "tool-call-evidence-ledger[api,cli,openai]",
]

[project.urls]
Homepage = "https://github.com/NoteAditya/tool-call-evidence-ledger"
Repository = "https://github.com/NoteAditya/tool-call-evidence-ledger"
Issues = "https://github.com/NoteAditya/tool-call-evidence-ledger/issues"

[project.scripts]
ledger = "evidence_ledger.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
evidence_ledger = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
